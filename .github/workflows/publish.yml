name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build (flit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel with flit
        run: |
          python -m pip install flit
          flit build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Configure a "pypi" environment (and trusted publisher) in the repo settings.
    environment: pypi
    permissions:
      id-token: write   # enables PyPI Trusted Publishing (no API token needed)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
