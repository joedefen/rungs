# ==============================================================================
# rungs -- build / release cheatsheet
# ==============================================================================
#
# Runs WITHOUT installing (from the project directory):
#   ./runner                              # dev wrapper (recommended)
#   PYTHONPATH=src python3 src/rungs/main.py   # equivalent
#
# Editable install for local hacking:
#   python3 -m venv .venv && . .venv/bin/activate
#   python3 -m pip install -e '.[test]'
#   rungs
#
# TESTS:
#   python3 -m pytest
#
# BUILD & PUBLISH (flit, no twine needed):
#   python3 -m pip install --user flit    # or: pipx install flit
#   ## bump the version in src/rungs/__init__.py (single source of truth)
#   flit build                            # writes dist/ (sdist + wheel)
#   flit publish                          # upload to PyPI (prompts for token)
#   ## TestPyPI dry-run:
#   flit publish --repository testpypi
#   ## install the result:
#   pipx upgrade rungs || pipx install rungs
#
# ==============================================================================

[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "rungs"
dynamic = ["version"]
description = "Interactive step-through menus for fuzzy Linux maintenance procedures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joe Defen", email = "joedef@gmail.com" },
]
keywords = [
    "menu",
    "maintenance",
    "procedure",
    "fuzzy",
    "cli",
    "tui",
    "linux",
    "system-administration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
rungs = "rungs.main:run"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/joedefen/rungs"
Repository = "https://github.com/joedefen/rungs"
Issues = "https://github.com/joedefen/rungs/issues"
Changelog = "https://github.com/joedefen/rungs/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.flit.sdist]
include = ["samples/", "images/"]
exclude = ["src/rungs/__pycache__/"]
