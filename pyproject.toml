[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "rungs"
dynamic = ["version"]
description = "Interactive step-through menus for fuzzy Linux maintenance procedures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joe Defen", email = "joedef@gmail.com" },
]
keywords = [
    "menu",
    "maintenance",
    "procedure",
    "fuzzy",
    "cli",
    "tui",
    "linux",
    "system-administration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
rungs = "rungs.main:run"

[project.urls]
Homepage = "https://github.com/joedefen/rungs"
Repository = "https://github.com/joedefen/rungs"
Issues = "https://github.com/joedefen/rungs/issues"
Changelog = "https://github.com/joedefen/rungs/releases"