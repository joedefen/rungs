# Debian/Ubuntu system update, then an optional release upgrade.
# Review before running -- these commands change system state.
# Copy these sections into ~/.config/rungs/rungs.ini (or run with --edit).

[ubuntu-update]
a: my-snaps                    # personal: replace root/home snapshots
b: sudo apt update             # refresh package lists
c: apt list --upgradable       # review what will change
d: sudo apt upgrade -y         # upgrade installed packages
e: sudo apt full-upgrade -y    # allow dependency removals if needed
f: sudo apt autoremove -y      # remove no-longer-needed packages
g: Clear old package files
   sudo apt clean; sudo apt autoclean
h: sudo snap refresh           # update snaps
i: sudo flatpak update
j: Check whether a new release is available
   sudo do-release-upgrade -c
k: rungs '>ubuntu-release-upgrade'
x: exit

[>ubuntu-release-upgrade]
a: Back up package selections
   dpkg --get-selections > ~/dpkg-selections.$(date +%F).txt
b: sudo apt install update-manager-core
c: Ensure the LTS upgrade prompt is enabled
   grep -q '^Prompt=' /etc/update-manager/release-upgrades || echo 'Prompt=lts' | sudo tee -a /etc/update-manager/release-upgrades
d: sudo do-release-upgrade     # interactive; may reboot
e: sudo apt --fix-broken install
f: sudo apt autoremove -y
g: lsb_release -a              # verify the new version
x: exit
