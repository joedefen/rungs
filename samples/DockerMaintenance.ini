# Docker housekeeping -- reclaim disk space.
# Review before running: `prune` deletes data irreversibly.
# Copy these sections into ~/.config/rungs/rungs.ini (or run with --edit).

[docker-maint]
a: docker system df        # show space used by images/containers/volumes
b: docker image prune      # remove dangling (untagged) images
c: Remove stopped containers
   docker container prune
d: docker volume prune     # remove volumes not used by any container
e: docker network prune    # remove networks not used by any container
f: Remove build cache
   docker builder prune
g: docker system prune     # remove all unused data (asks for confirmation)
h: docker system prune -a --volumes   # AGGRESSIVE: unused images + volumes too
i: docker image ls         # review what is left
j: docker system df        # confirm space was reclaimed
x: exit
