# ===========================================================================
# IntegrationSpec.ini -- a "stepped spec" (executable runbook) for rungs.
# AD-HOC file: run it directly; nothing is copied into ~/.config/rungs.
# ===========================================================================
#
# Run it from the project root:
#
#     rungs samples/IntegrationSpec.ini
#
# `rungs samples/IntegrationSpec.ini` lists the menus in the file; add
# -n/--dry-run to see every command without running anything.
#
# This file "kicks the tires" of an installed rungs: it checks that the console
# launcher is on $PATH, that --version / --help behave, and that a menu-less
# file is rejected.  Every command is read-only and safe to re-run.
#
# ===========================================================================
# HOW TO READ THIS SPEC
# ===========================================================================
# The FIRST line of every entry is its description; rungs shows it in the menu.
# The prefix right after "::" gives the entry's level in the ladder:
#
#   ":: *<text>"        -> STATE-CHANGING (order matters; the '*' butts the
#                           text).  Run it before the "- CHK:" entries that
#                           depend on it.
#   "::  <text>"        -> RUNS the tool and checks it in one go.
#   "::  - CHK: <text>" -> a CHECK.  Inspects existing state only (changes
#                           nothing).  It prints the raw evidence, states what
#                           to EXPECT, then a one-line verdict.  Safe to SKIP.
#
# A verdict is a blank line followed by, from $OK_MSG / $FAIL_MSG:
#     ✓✓✓✓✓✓✓✓✓✓ OK
# or
#     ✘✘✘✘✘✘✘✘✘✘ FAIL
# Grep a captured run for either marker to seed the automatic result.  These
# tokens are display-only conventions -- rungs itself does not interpret them.
#
# NOTES
#   * rungs runs each command block through /bin/sh (POSIX sh): no bashisms.
#   * Quit a menu with 'x' whenever you have seen enough -- you need not finish
#     a section.
# ===========================================================================

# Verdict strings shared by every check.  [__GLOBAL__] is hidden from the menu
# list and is inherited by every section and sub-menu.
[__GLOBAL__]
+ENV: OK_MSG=✓✓✓✓✓✓✓✓✓✓ OK
      FAIL_MSG=✘✘✘✘✘✘✘✘✘✘ FAIL


# ---------------------------------------------------------------------------
# Topic: the rungs console launcher (install smoke test)
# ---------------------------------------------------------------------------
[TEST-rungs-install]

01: ::  rungs --version prints a version. EXPECT: a "rungs <number>" line
   echo '$ rungs --version'
   rungs --version 2>&1
   rungs --version 2>/dev/null | grep -q '^rungs [0-9]' \
     && { echo; echo "$OK_MSG"; } \
     || { echo; echo "$FAIL_MSG"; exit 1; }

02: ::  rungs --help lists the documented options. EXPECT: --edit, --dry-run, --version
   echo '$ rungs --help'
   rungs --help 2>&1
   fail=0
   for opt in --edit --dry-run --version; do
   rungs --help 2>&1 | grep -q -- "$opt" || { echo "FAILED: --help omits $opt"; fail=1; }
   done
   if [ "$fail" -eq 0 ]; then echo; echo "$OK_MSG"; else echo; echo "$FAIL_MSG"; exit 1; fi

03: ::  - CHK: a menu-less file is rejected as misuse. EXPECT: an ERROR line and a non-zero status
   echo '$ rungs /dev/null'
   out=$(rungs /dev/null 2>&1); status=$?
   echo "$out"
   echo "exit status: $status"
   fail=0
   [ "$status" -ne 0 ] || fail=1
   echo "$out" | grep -qi 'error\|neither' || fail=1
   if [ "$fail" -eq 0 ]; then echo; echo "$OK_MSG"; else echo; echo "$FAIL_MSG"; exit 1; fi

x: exit
